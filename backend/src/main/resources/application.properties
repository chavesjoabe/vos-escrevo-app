# MongoDB Configuration
quarkus.mongodb.connection-string=${DATABASE_URL:${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}}
quarkus.mongodb.database=${MONGODB_DATABASE:commented-bible}

# HTTP & CORS Configuration (allow local Vite dev origin and LAN IPs for iPad testing)
quarkus.http.port=${PORT:${QUARKUS_HTTP_PORT:3000}}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Auth Token Configuration
auth.token.secret=${AUTH_TOKEN_SECRET:${JWT_SECRET:commented-bible-default-jwt-hmac-secret-key-2026-blivre}}

# Standalone deployment packaging
quarkus.package.jar.type=uber-jar

# Initial BLIVRE Bible Content Seeding
bible.seed.enabled=${BIBLE_SEED_ENABLED:true}
bible.seed.resource-path=/seed/blivre-bible.json

# Test profile overrides (prevent automatic seed against live cluster during unit tests)
%test.quarkus.http.port=8081
%test.bible.seed.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
